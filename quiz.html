<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz | AI Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">🤖 AI Explorer</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="tools.html">AI Tools</a>
        <a href="quiz.html" class="active">Quiz</a>
    </nav>
</header>


<main>

    <section class="page-hero">
        <p class="badge">🧠 TEST YOUR KNOWLEDGE</p>

        <h1>AI Quiz</h1>

        <p>
            Answer the questions and see how much you know
            about Artificial Intelligence.
        </p>
    </section>


    <section class="quiz-section">

        <div class="quiz-card">

            <div class="quiz-top">
                <span id="questionNumber">Question 1 of 10</span>
                <span id="scoreText">Score: 0</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <h2 id="question"></h2>

            <div id="answers" class="answers"></div>

            <p id="feedback"></p>

            <button
                id="nextButton"
                class="button primary next-button"
                onclick="nextQuestion()"
                style="display:none;">
                Next Question →
            </button>

        </div>


        <div id="result" class="result-box" style="display:none;">

            <div class="result-icon">🏆</div>

            <h2>Quiz Complete!</h2>

            <p id="finalScore"></p>

            <p id="finalMessage"></p>

            <button class="button primary" onclick="restartQuiz()">
                🔄 Try Again
            </button>

        </div>

    </section>

</main>


<footer>
    <p>🤖 AI Explorer — <strong>Explore • Learn • Create</strong></p>
    <p>Created by <strong>Mohamed Mateen - 6C</strong></p>
</footer>


<script>

const questions = [

    {
        question: "What does AI stand for?",
        answers: [
            "Automatic Internet",
            "Artificial Intelligence",
            "Advanced Information",
            "Automated Input"
        ],
        correct: 1
    },

    {
        question: "Which of these is an example of AI?",
        answers: [
            "A pencil",
            "A ruler",
            "A voice assistant",
            "A notebook"
        ],
        correct: 2
    },

    {
        question: "What can AI help people do?",
        answers: [
            "Learn",
            "Create",
            "Analyze information",
            "All of these"
        ],
        correct: 3
    },

    {
        question: "Which technology can recognize objects in pictures?",
        answers: [
            "AI",
            "Paper",
            "A ruler",
            "A pencil"
        ],
        correct: 0
    },

    {
        question: "What is a chatbot?",
        answers: [
            "A computer program that communicates with people",
            "A type of keyboard",
            "A computer screen",
            "A video game"
        ],
        correct: 0
    },

    {
        question: "Which is a good AI safety habit?",
        answers: [
            "Share passwords",
            "Protect personal information",
            "Click every link",
            "Share private information"
        ],
        correct: 1
    },

    {
        question: "AI can help create which of these?",
        answers: [
            "Text",
            "Images",
            "Ideas",
            "All of these"
        ],
        correct: 3
    },

    {
        question: "Which company developed ChatGPT?",
        answers: [
            "OpenAI",
            "NASA",
            "Google Maps",
            "Wikipedia"
        ],
        correct: 0
    },

    {
        question: "What should you do with important information from AI?",
        answers: [
            "Always believe it",
            "Check the information",
            "Share it immediately",
            "Never question it"
        ],
        correct: 1
    },

    {
        question: "What is a good way to use AI for school?",
        answers: [
            "Copy everything",
            "Use AI to learn and understand",
            "Never study",
            "Never check answers"
        ],
        correct: 1
    }

];


let currentQuestion = 0;
let score = 0;


function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) +
        " of " + questions.length;

    document.getElementById("scoreText").textContent =
        "Score: " + score;

    document.getElementById("question").textContent =
        q.question;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextButton").style.display =
        "none";


    const progress =
        ((currentQuestion) / questions.length) * 100;

    document.getElementById("progress").style.width =
        progress + "%";


    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";


    q.answers.forEach((answer, index) => {

        const button =
            document.createElement("button");

        button.className = "answer-button";

        button.textContent = answer;

        button.onclick = () =>
            chooseAnswer(index, button);

        answers.appendChild(button);

    });

}


function chooseAnswer(index, button) {

    const q = questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer-button");

    buttons.forEach(btn => {
        btn.disabled = true;
    });


    if (index === q.correct) {

        button.classList.add("correct");

        document.getElementById("feedback").textContent =
            "✅ Correct! Great job!";

        score++;

    } else {

        button.classList.add("wrong");

        buttons[q.correct].classList.add("correct");

        document.getElementById("feedback").textContent =
            "❌ Not quite. The correct answer is highlighted.";

    }


    document.getElementById("scoreText").textContent =
        "Score: " + score;

    document.getElementById("nextButton").style.display =
        "inline-block";

}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        showResult();

    } else {

        loadQuestion();

    }

}


function showResult() {

    document.querySelector(".quiz-card").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    document.getElementById("progress").style.width =
        "100%";

    document.getElementById("finalScore").textContent =
        "Your score is " + score +
        " out of " + questions.length + ".";


    let message;

    if (score === 10) {

        message =
            "🏆 Perfect score! You are an AI Explorer champion!";

    } else if (score >= 7) {

        message =
            "🌟 Excellent! You know a lot about AI!";

    } else if (score >= 5) {

        message =
            "👍 Good work! Keep learning and exploring!";

    } else {

        message =
            "📚 Nice try! Explore the website and try again!";

    }


    document.getElementById("finalMessage").textContent =
        message;

}


function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    document.querySelector(".quiz-card").style.display =
        "block";

    document.getElementById("result").style.display =
        "none";

    loadQuestion();

}


loadQuestion();

</script>

</body>
</html>
